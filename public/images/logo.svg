<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="70%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#171717" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#goldBorder)" stroke-width="6" />
  <circle cx="100" cy="100" r="88" fill="url(#bgGrad)" stroke="#450a0a" stroke-width="2" />
  
  <!-- Decorative Inner Ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8" />
  
  <!-- Central Martial Arts Character 武 -->
  <text x="100" y="125" font-family="'Shojumaru', 'Ma Shan Zheng', 'Cinzel', serif" font-size="78" font-weight="bold" fill="#fbbf24" text-anchor="middle" filter="drop-shadow(0px 3px 6px rgba(0,0,0,0.8))">武</text>
  
  <!-- Top & Bottom decorative stars -->
  <polygon points="100,20 103,28 111,28 105,33 107,41 100,36 93,41 95,33 89,28 97,28" fill="#fbbf24" />
  <polygon points="100,165 103,173 111,173 105,178 107,186 100,181 93,186 95,178 89,173 97,173" fill="#fbbf24" />
</svg>
